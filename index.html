<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaignia</title>
<style>
:root {
  --bg: #faf7f2;
  --card: #fffdf9;
  --ink: #23201b;
  --muted: #6f6a61;
  --line: #e5ddd2;
  --accent: #6b4e1f;
  --accent-ink: #ffffff;
  --radius: 10px;
  --measure: 640px;
  --serif: Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191612;
    --card: #221e19;
    --ink: #ece5d8;
    --muted: #b3a897;
    --line: #3a332a;
    --accent: #d9b36a;
    --accent-ink: #191612;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.65;
  font-size: 17px;
}
.topbar {
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}
.topbar-inner {
  max-width: var(--measure);
  margin: 0 auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 20px;
}
.brand {
  font-family: var(--serif);
  font-size: 22px;
  margin-right: auto;
  text-decoration: none;
  color: var(--ink);
}
.topbar nav { display: flex; gap: 16px; }
.topbar a { color: var(--muted); text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }
.topbar a[aria-current="page"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.topbar a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}
main {
  max-width: var(--measure);
  margin: 0 auto;
  padding: 32px 20px 80px;
}
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.3; }
h1 { font-size: 30px; margin: 0 0 12px; }
h2 { font-size: 23px; margin: 28px 0 10px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin: 16px 0;
}
.hero-action {
  font-family: var(--serif);
  font-size: 26px;
  line-height: 1.4;
  margin: 8px 0 4px;
}
.contrast { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 8px; }
@media (max-width: 560px) { .contrast { grid-template-columns: 1fr; } }
.contrast .card { margin: 0; }
.contrast h3 { margin-top: 0; font-size: 18px; }
label { display: block; font-weight: 600; margin: 16px 0 6px; }
.hint { font-weight: 400; color: var(--muted); font-size: 15px; margin: 4px 0 0; }
input[type="text"], input[type="number"], input[type="date"], textarea, select {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  min-height: 44px;
}
textarea { min-height: 96px; resize: vertical; }
button, .btn {
  font: inherit;
  min-height: 44px;
  padding: 10px 20px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
button:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-secondary {
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}
.btn-row { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
.error { color: inherit; font-size: 15px; margin: 6px 0 0; border-left: 3px solid var(--accent); padding-left: 10px; }
.steps { color: var(--muted); font-size: 15px; }
ul.plain { list-style: none; padding: 0; margin: 8px 0; }
ul.plain li { padding: 10px 0; border-bottom: 1px solid var(--line); }
ul.plain li:last-child { border-bottom: 0; }
.row-link { color: inherit; text-decoration: none; display: block; padding: 12px 0; }
.row-link:hover .row-title { text-decoration: underline; }
.tag { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font-size: 14px; color: var(--muted); margin-left: 8px; }
.quiet-link { background: none; border: 0; padding: 12px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; cursor: pointer; font: inherit; }
.radio-group { display: flex; gap: 12px; margin: 8px 0 16px; }
.radio-group label { font-weight: 400; border: 1px solid var(--line); border-radius: 8px; padding: 10px 18px; margin: 0; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; }
.banner {
  max-width: var(--measure);
  margin: 0 auto;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
}
textarea.readonly-msg { min-height: 220px; font-size: 15px; }
.count { font-size: 14px; color: var(--muted); }
.checkbox-row { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0; }
.checkbox-row input { width: 24px; height: 24px; margin-top: 2px; flex-shrink: 0; }
.checkbox-row label { margin: 0; font-weight: 400; }
.verdict-cta { border: 2px solid var(--accent); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none; animation: none; }
}
@media (prefers-reduced-motion: no-preference) {
  main { transition: opacity 120ms ease-in; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/now" id="brand">Campaignia</a>
    <nav aria-label="Primary">
      <a href="#/now" data-nav="now">Now</a>
      <a href="#/history" data-nav="history">History</a>
      <a href="#/backup" data-nav="backup">Backup</a>
    </nav>
  </div>
</header>
<div class="banner" id="storageBanner" hidden></div>
<main id="app" tabindex="-1"></main>
<div class="sr-only" aria-live="polite" id="live"></div>

<script>
(function () {
"use strict";

/* 1. constants */
var APP_NAME = "Campaignia";
var CURRENCY = "Rs";
var STORE_KEY = "pot.v1";
var PASS_PHRASE = "I met every criterion";
var FAIL_PHRASE = "I did not meet every criterion";
var ABANDON_WORD = "abandon";
var LIMITS = {
  objective: [5, 140],
  source: [2, 120],
  criterion: [8, 160],
  criteriaCount: [2, 3],
  holderName: [1, 60],
  treatWhat: [3, 120],
  treatDetails: [0, 160],
  charityName: [2, 80],
  charityDetails: [0, 160],
  obstacle: [5, 140],
  nextAction: [5, 140],
  evidence: [10, 300],
  verdictMinDays: 3,
  verdictMaxDays: 30,
  verdictDefaultDays: 7,
  treatMaxAfterVerdict: 60
};
var inr = new Intl.NumberFormat("en-IN");

/* 2. dates (local YMD strings, UTC math) */
function pad(n) { return (n < 10 ? "0" : "") + n; }
function todayYMD() {
  var d = new Date();
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function parseYMD(s) {
  if (typeof s !== "string") return null;
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (!m) return null;
  var y = +m[1], mo = +m[2], d = +m[3];
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  var dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return { y: y, m: mo, d: d };
}
function isValidYMD(s) { return parseYMD(s) !== null; }
function addDays(ymd, n) {
  var p = parseYMD(ymd);
  var dt = new Date(p.y, p.m - 1, p.d + n);
  return dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate());
}
function diffDays(a, b) {
  var pa = parseYMD(a), pb = parseYMD(b);
  var ua = Date.UTC(pa.y, pa.m - 1, pa.d);
  var ub = Date.UTC(pb.y, pb.m - 1, pb.d);
  return Math.round((ub - ua) / 86400000);
}
function fmtDate(ymd) {
  var p = parseYMD(ymd);
  if (!p) return ymd;
  var dt = new Date(p.y, p.m - 1, p.d);
  return dt.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}
function countdownText(target) {
  var d = diffDays(todayYMD(), target);
  if (d > 1) return "in " + d + " days";
  if (d === 1) return "tomorrow";
  if (d === 0) return "today";
  return Math.abs(d) + (Math.abs(d) === 1 ? " day ago" : " days ago");
}
function verdictCountdown(verdictDate) {
  var d = diffDays(todayYMD(), verdictDate);
  if (d > 1) return "in " + d + " days";
  if (d === 1) return "tomorrow";
  return "today";
}

/* 3. domain (pure, no DOM) */
function uid() {
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now() + "-" + Math.floor(Math.random() * 1e9);
}
function activeCampaign(state) {
  for (var i = 0; i < state.campaigns.length; i++) {
    if (state.campaigns[i].status === "active") return state.campaigns[i];
  }
  return null;
}
function phaseOf(c, today) {
  var dv = diffDays(today, c.verdictDate);
  if (dv > 0) return "running";
  if (diffDays(c.verdictDate, today) <= 2) return "verdict_ready";
  return "overdue";
}
function overdueDays(c, today) { return diffDays(c.verdictDate, today); }
function lenOk(s, min, max) {
  var t = (s || "").trim();
  return t.length >= min && t.length <= max;
}
function parseStake(raw) {
  if (raw === null || raw === undefined) return { error: "Enter a stake amount." };
  var s = String(raw).trim().replace(/,/g, "").replace(/\s+/g, "");
  if (!s) return { error: "Enter a stake amount." };
  if (s.indexOf(".") !== -1) return { error: "Enter whole rupees, no decimals." };
  if (!/^\d+$/.test(s)) return { error: "Enter whole rupees, digits only." };
  var v = parseInt(s, 10);
  if (!isFinite(v) || v < 1) return { error: "Stake must be at least Rs 1." };
  return { value: v };
}
function validateDraft(d, startDate) {
  var e = {};
  if (!lenOk(d.objective, LIMITS.objective[0], LIMITS.objective[1])) e.objective = "Objective must be 5 to 140 characters.";
  if (!lenOk(d.source, LIMITS.source[0], LIMITS.source[1])) e.source = "Source must be 2 to 120 characters.";
  var crits = d.criteria || [];
  if (crits.length < 2) e.criteria = "Add at least 2 criteria.";
  else if (crits.length > 3) e.criteria = "Keep at most 3 criteria.";
  else {
    for (var i = 0; i < crits.length; i++) {
      if (!lenOk(crits[i], LIMITS.criterion[0], LIMITS.criterion[1])) { e.criteria = "Each criterion must be 8 to 160 characters."; break; }
    }
  }
  var st = parseStake(d.stake);
  if (st.error) e.stake = st.error;
  if (d.holderType !== "person" && d.holderType !== "pot") e.holderType = "Choose who holds the stake.";
  if (d.holderType === "person" && !lenOk(d.holderName, 1, 60)) e.holderName = "Enter the holder name, up to 60 characters.";
  if (!lenOk(d.treatWhat, 3, 120)) e.treatWhat = "Describe the treat specifically, 3 to 120 characters.";
  if ((d.treatDetails || "").length > 160) e.treatDetails = "Keep details under 160 characters.";
  if (!lenOk(d.charityName, 2, 80)) e.charityName = "Charity name must be 2 to 80 characters.";
  if ((d.charityDetails || "").length > 160) e.charityDetails = "Keep details under 160 characters.";
  var start = startDate || todayYMD();
  var minV = addDays(start, LIMITS.verdictMinDays);
  var maxV = addDays(start, LIMITS.verdictMaxDays);
  if (!isValidYMD(d.verdictDate)) e.verdictDate = "Pick a verdict date.";
  else if (diffDays(start, d.verdictDate) < LIMITS.verdictMinDays || diffDays(start, d.verdictDate) > LIMITS.verdictMaxDays) {
    e.verdictDate = "Verdict must be 3 to 30 days after the start.";
  }
  if (!isValidYMD(d.treatDate)) e.treatDate = "Pick a treat date.";
  else if (isValidYMD(d.verdictDate)) {
    if (diffDays(d.verdictDate, d.treatDate) < 0) e.treatDate = "Treat date cannot be before the verdict date.";
    else if (diffDays(d.verdictDate, d.treatDate) > LIMITS.treatMaxAfterVerdict) e.treatDate = "Treat date must be within 60 days after the verdict.";
  }
  if (!lenOk(d.obstacleSituation, 5, 140)) e.obstacleSituation = "Name what will pull you off, 5 to 140 characters.";
  if (!lenOk(d.obstacleResponse, 5, 140)) e.obstacleResponse = "Write what you will do instead, 5 to 140 characters.";
  if (!lenOk(d.nextAction, 5, 140)) e.nextAction = "Write the first concrete step, 5 to 140 characters.";
  return e;
}
var LOCKED_FIELDS = ["objective", "source", "criteria", "stake", "holder", "treat", "charity", "startDate", "verdictDate"];
function updateActiveCampaign(campaign, patch) {
  for (var k in patch) {
    if (LOCKED_FIELDS.indexOf(k) !== -1) return { error: "Field " + k + " is locked after sealing." };
  }
  var allowed = ["nextAction", "obstacleSituation", "obstacleResponse"];
  for (var k2 in patch) {
    if (allowed.indexOf(k2) === -1) return { error: "Field " + k2 + " cannot be updated." };
  }
  if (patch.nextAction !== undefined && !lenOk(patch.nextAction, 5, 140)) return { error: "Next action must be 5 to 140 characters." };
  if (patch.obstacleSituation !== undefined && !lenOk(patch.obstacleSituation, 5, 140)) return { error: "Obstacle must be 5 to 140 characters." };
  if (patch.obstacleResponse !== undefined && !lenOk(patch.obstacleResponse, 5, 140)) return { error: "Response must be 5 to 140 characters." };
  if (patch.nextAction !== undefined) campaign.nextAction = patch.nextAction.trim();
  if (patch.obstacleSituation !== undefined) campaign.obstacle.situation = patch.obstacleSituation.trim();
  if (patch.obstacleResponse !== undefined) campaign.obstacle.response = patch.obstacleResponse.trim();
  return { ok: true };
}
function outcomeFromResults(results) {
  if (!results.length) return "fail";
  for (var i = 0; i < results.length; i++) if (!results[i]) return "fail";
  return "pass";
}
function expectedPhrase(results) {
  return outcomeFromResults(results) === "pass" ? PASS_PHRASE : FAIL_PHRASE;
}
function phraseMatches(input, expected) {
  return String(input || "").trim().toLowerCase() === expected.toLowerCase();
}
function calibrationSummary(settledNewestFirst) {
  if (settledNewestFirst.length < 3) return null;
  var last5 = settledNewestFirst.slice(0, 5);
  var passes = last5.filter(function (c) { return c.verdict && c.verdict.outcome === "pass"; }).length;
  var line = "Passed " + passes + " of " + last5.length + ".";
  var last3 = settledNewestFirst.slice(0, 3).map(function (c) { return c.verdict.outcome; });
  var advice = "";
  if (last3.every(function (o) { return o === "pass"; })) advice = "You have passed your last 3. Consider a higher stake or tighter criteria.";
  else if (last3.every(function (o) { return o === "fail" || o === "abandoned"; })) advice = "Your last 3 did not land. Consider a narrower objective.";
  return { line: line, advice: advice };
}
function stakeholderSealMessage(c) {
  var lines = [];
  lines.push("Hi " + c.holder.name + ",");
  lines.push("");
  lines.push("I am starting a commitment: " + c.objective);
  lines.push("Source: " + c.source);
  lines.push("");
  lines.push("Done looks like:");
  for (var i = 0; i < c.criteria.length; i++) lines.push((i + 1) + ". " + c.criteria[i]);
  lines.push("");
  lines.push("I have moved Rs " + inr.format(c.stake) + " to you to hold. On " + fmtDate(c.verdictDate) + " I will show you my evidence.");
  lines.push("If I met every criterion, please release the money to me; it is for " + c.treat.what + ".");
  lines.push("If not, please donate it to " + c.charity.name + " and let me know once it is done.");
  lines.push("Please do not let me renegotiate the criteria.");
  return lines.join("\n");
}
function stakeholderVerdictMessage(c, results, evidence) {
  var lines = [];
  lines.push("Hi " + c.holder.name + ",");
  lines.push("");
  lines.push("Verdict on: " + c.objective);
  lines.push("");
  for (var i = 0; i < c.criteria.length; i++) {
    lines.push((i + 1) + ". " + c.criteria[i] + " [" + (results[i] === true ? "Met" : results[i] === false ? "Not met" : "Undecided") + "]");
  }
  lines.push("");
  lines.push("Evidence: " + (evidence || "").trim());
  lines.push("Do you agree with this result?");
  return lines.join("\n");
}

/* 4. store */
var storageAvailable = true;
var state = { schemaVersion: 1, meta: { lastExportAt: null }, campaigns: [] };
function blankState() { return { schemaVersion: 1, meta: { lastExportAt: null }, campaigns: [] }; }
function loadState() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) { state = blankState(); return; }
    var parsed = JSON.parse(raw);
    if (!parsed || parsed.schemaVersion !== 1 || !Array.isArray(parsed.campaigns)) {
      storageAvailable = true;
      state = blankState();
      showStorageBanner("Saved data has an unsupported format. Nothing was overwritten. Export is unavailable in Phase 1, so your previous data is left untouched in storage.");
      return;
    }
    state = parsed;
    if (!state.meta) state.meta = { lastExportAt: null };
  } catch (err) {
    storageAvailable = false;
    state = blankState();
    showStorageBanner("Your browser is blocking storage. Data will not be saved. Export often.");
  }
}
function saveState() {
  if (!storageAvailable) return;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (err) {
    storageAvailable = false;
    showStorageBanner("Your browser is blocking storage. Data will not be saved. Export often.");
  }
}
function showStorageBanner(msg) {
  var b = document.getElementById("storageBanner");
  b.textContent = msg;
  b.hidden = false;
}

/* 5. ui helpers */
var app = document.getElementById("app");
var live = document.getElementById("live");
function clearApp() { while (app.firstChild) app.removeChild(app.firstChild); }
function el(tag, text, attrs) {
  var n = document.createElement(tag);
  if (text !== null && text !== undefined) n.textContent = text;
  if (attrs) for (var k in attrs) {
    if (k === "className") n.className = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  return n;
}
function announce(msg) { live.textContent = msg; }
function fmtRs(n) { return CURRENCY + " " + inr.format(n); }
function holderLabel(c) {
  if (c.holder.type === "person") return "Stake held by " + c.holder.name + ".";
  return "Stake held in a separate pot.";
}
function copyText(text, btn) {
  function done() { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy"; }, 1500); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallback(); });
  } else fallback();
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }
}
function fieldError(container, id, msg) {
  if (!msg) return;
  var p = el("p", msg, { className: "error", id: id });
  container.appendChild(p);
}
function setNav(route) {
  var links = document.querySelectorAll("[data-nav]");
  for (var i = 0; i < links.length; i++) {
    if (links[i].getAttribute("data-nav") === route) links[i].setAttribute("aria-current", "page");
    else links[i].removeAttribute("aria-current");
  }
}
function link(href, text, cls) {
  var a = el("a", text, { href: href });
  if (cls) a.className = cls;
  return a;
}

/* 6. views */
function viewEmptyHome() {
  setNav("now");
  clearApp();
  var hasAny = state.campaigns.length > 0;
  var h = el("h1", APP_NAME);
  h.tabIndex = -1;
  app.appendChild(h);
  if (!hasAny) {
    app.appendChild(el("p", "Put a stake on one goal. Do the work for a week. Settle honestly: treat yourself or donate.", { className: "muted" }));
    var how = el("div", null, { className: "card" });
    how.appendChild(el("p", "How it works", null));
    var ul = document.createElement("ul");
    ["Put a stake on one goal.", "Do the work for a week.", "Settle honestly: treat yourself or donate."].forEach(function (t) {
      ul.appendChild(el("li", t));
    });
    how.appendChild(ul);
    var start = link("#/new", "Start a campaign", "btn");
    how.appendChild(start);
    app.appendChild(how);
  } else {
    app.appendChild(el("p", "No active campaign.", { className: "muted" }));
    app.appendChild(link("#/new", "Start a campaign", "btn"));
  }
  renderPendingList();
  h.focus({ preventScroll: true });
}
function renderPendingList() {
  var pending = state.campaigns.filter(function (c) { return c.status === "settled" && c.verdict && !c.verdict.payoutDone; });
  if (!pending.length) return;
  app.appendChild(el("h2", "Pending"));
  var ul = el("ul", null, { className: "plain" });
  pending.forEach(function (c) {
    var li = document.createElement("li");
    var o = c.verdict.outcome;
    var line;
    if (o === "pass") line = "Treat: " + c.treat.what + ", on " + fmtDate(c.treat.date) + " (" + countdownText(c.treat.date) + ")";
    else line = "Donate " + fmtRs(c.stake) + " to " + c.charity.name;
    li.appendChild(el("span", line));
    li.appendChild(link("#/c/" + c.id, "Open", null));
    li.appendChild(document.createTextNode(" "));
    var t = el("button", o === "pass" ? "Treat enjoyed" : "Donation made", { className: "btn-secondary", type: "button" });
    t.style.marginLeft = "8px";
    t.addEventListener("click", function () {
      c.verdict.payoutDone = true;
      c.verdict.payoutDoneAt = new Date().toISOString();
      saveState();
      route();
    });
    li.appendChild(t);
    ul.appendChild(li);
  });
  app.appendChild(ul);
}
function viewNow() {
  var a = activeCampaign(state);
  if (!a) { viewEmptyHome(); return; }
  var today = todayYMD();
  var ph = phaseOf(a, today);
  setNav("now");
  clearApp();
  var h = el("h1", a.objective);

  app.appendChild(critBox);
  var confirmBox = el("div");
  var settleBtn = el("button", "Settle", { type: "button" });
  function refreshConfirm() {
    confirmBox.textContent = "";
    var allChosen = v.results.every(function (r) { return r === true || r === false; });
    if (c.holder.type === "person") {
      confirmBox.appendChild(el("h2", "Confirmation"));
      var chk = el("div", null, { className: "checkbox-row" });
      var cb = document.createElement("input");
      cb.type = "checkbox"; cb.id = "vConfirm";
      cb.checked = !!v.checked;
      cb.addEventListener("change", function () { v.checked = cb.checked; settleBtn.disabled = !canSettle(c, v); });
      var lab2 = el("label", c.holder.name + " has seen my evidence and agrees with this result.", { for: "vConfirm" });
      chk.appendChild(cb); chk.appendChild(lab2);
      confirmBox.appendChild(chk);
      confirmBox.appendChild(el("h2", "Message to the stakeholder"));
      var mta = document.createElement("textarea");
      mta.className = "readonly-msg"; mta.readOnly = true;
      mta.value = stakeholderVerdictMessage(c, v.results, v.evidence);
      mta.id = "vStakeMsg";
      confirmBox.appendChild(mta);
      var cp = el("button", "Copy", { type: "button", className: "btn-secondary" });
      cp.addEventListener("click", function () { copyText(mta.value, cp); });
      confirmBox.appendChild(cp);
    } else {
      confirmBox.appendChild(el("h2", "Confirmation"));
      if (allChosen) {
        var exp = expectedPhrase(v.results);
        confirmBox.appendChild(el("p", "Type exactly: " + exp, { className: "muted" }));
        var pLab = el("label", "Confirmation phrase", { for: "vPhrase" });
        confirmBox.appendChild(pLab);
        var pi = document.createElement("input");
        pi.type = "text"; pi.id = "vPhrase"; pi.value = v.phrase || "";
        pi.autocomplete = "off";
        pi.addEventListener("input", function () { v.phrase = pi.value; settleBtn.disabled = !canSettle(c, v); });
        confirmBox.appendChild(pi);
      } else {
        confirmBox.appendChild(el("p", "Choose Met or Not met for every criterion first.", { className: "muted" }));
      }
    }
    settleBtn.disabled = !canSettle(c, v);
  }
  c.criteria.forEach(function (crit, i) {
    var fs = document.createElement("fieldset");
    fs.style.border = "0";
    fs.style.padding = "0";
    fs.style.margin = "0 0 12px";
    var lg = el("legend", crit);
    fs.appendChild(lg);
    var grp = el("div", null, { className: "radio-group" });
    [["met", "Met"], ["not", "Not met"]].forEach(function (opt) {
      var lab = el("label", null);
      var r = document.createElement("input");
      r.type = "radio"; r.name = "crit" + i; r.value = opt[0];
      r.style.width = "auto";
      if ((v.results[i] === true && opt[0] === "met") || (v.results[i] === false && opt[0] === "not")) r.checked = true;
      r.addEventListener("change", function () {
        v.results[i] = (opt[0] === "met");
        refreshConfirm();
      });
      lab.appendChild(r);
      lab.appendChild(document.createTextNode(opt[1]));
      grp.appendChild(lab);
    });
    fs.appendChild(grp);
    critBox.appendChild(fs);
  });
  var eLab = el("label", "Evidence", { for: "vEvidence" });
  app.appendChild(eLab);
  var ta = document.createElement("textarea");
  ta.id = "vEvidence";
  ta.maxLength = 300;
  ta.value = v.evidence;
  ta.placeholder = "What you did, or what happened.";
  ta.addEventListener("input", function () {
    v.evidence = ta.value;
    count.textContent = ta.value.trim().length + " / 300";
    var m = document.getElementById("vStakeMsg");
    if (m) m.value = stakeholderVerdictMessage(c, v.results, v.evidence);
    settleBtn.disabled = !canSettle(c, v);
  });
  app.appendChild(ta);
  var count = el("p", v.evidence.trim().length + " / 300", { className: "count" });
  app.appendChild(count);
  app.appendChild(confirmBox);
  refreshConfirm();
  settleBtn.addEventListener("click", function () {
    if (!canSettle(c, v)) return;
    var out = outcomeFromResults(v.results);
    c.status = "settled";
    c.verdict = {
      settledAt: new Date().toISOString(),
      outcome: out,
      criteriaResults: v.results.slice(),
      evidence: v.evidence.trim(),
      confirmedBy: c.holder.type === "person" ? "stakeholder" : "phrase",
      reflection: "",
      payoutDone: false,
      payoutDoneAt: null
    };
    saveState();
    verdictLocal = null;
    location.hash = "#/c/" + c.id;
  });
  var row = el("div", null, { className: "btn-row" });
  row.appendChild(settleBtn);
  row.appendChild(link("#/now", "Back", "btn btn-secondary"));
  app.appendChild(row);
  h.focus({ preventScroll: true });
}
function canSettle(c, v) {
  if (!v.results.every(function (r) { return r === true || r === false; })) return false;
  var t = (v.evidence || "").trim();
  if (t.length < 10 || t.length > 300) return false;
  if (c.holder.type === "person") return !!v.checked;
  return phraseMatches(v.phrase, expectedPhrase(v.results));
}

/* result */
function viewResult(id) {
  var c = null;
  for (var i = 0; i < state.campaigns.length; i++) if (state.campaigns[i].id === id) c = state.campaigns[i];
  setNav(c && c.status === "settled" ? "history" : "now");
  clearApp();
  if (!c || c.status !== "settled" || !c.verdict) {
    app.appendChild(el("h1", "Not found"));
    app.appendChild(link("#/now", "Back to Now", "btn btn-secondary"));
    return;
  }
  var o = c.verdict.outcome;
  var h = el("h1", o === "pass" ? "Settled. Passed." : o === "abandoned" ? "Settled. Abandoned." : "Settled. Not passed.");
  h.tabIndex = -1;
  app.appendChild(h);
  app.appendChild(el("p", c.objective, { className: "muted" }));
  var box = el("div", null, { className: "card" });
  if (o === "pass") {
    box.appendChild(el("p", "You met every criterion. " + fmtRs(c.stake) + " is released. It is for " + c.treat.what + ", on " + fmtDate(c.treat.date) + "."));
    if (c.holder.type === "pot") box.appendChild(el("p", "This treat is only obtainable from this pot.", { className: "muted" }));
    box.appendChild(el("p", "Treat " + countdownText(c.treat.date) + ".", { className: "muted" }));
    box.appendChild(el("p", "When the day comes: phone away, slow down, notice three specific details.", { className: "muted" }));
  } else {
    box.appendChild(el("p", o === "abandoned" ? "Campaign abandoned. " + fmtRs(c.stake) + " goes to " + c.charity.name + "." : "Not every criterion was met. " + fmtRs(c.stake) + " goes to " + c.charity.name + "."));
    if (c.charity.details) box.appendChild(el("p", c.charity.details, { className: "muted" }));
    if (c.holder.type === "person") box.appendChild(el("p", "Ask " + c.holder.name + " to donate and confirm.", { className: "muted" }));
  }
  app.appendChild(box);
  var chk = el("div", null, { className: "checkbox-row" });
  var cb = document.createElement("input");
  cb.type = "checkbox"; cb.id = "payoutT";
  cb.checked = !!c.verdict.payoutDone;
  cb.addEventListener("change", function () {
    c.verdict.payoutDone = cb.checked;
    c.verdict.payoutDoneAt = cb.checked ? new Date().toISOString() : null;
    saveState();
  });
  chk.appendChild(cb);
  chk.appendChild(el("label", o === "pass" ? "Treat enjoyed" : "Donation made", { for: "payoutT" }));
  app.appendChild(chk);
  app.appendChild(el("h2", "Reflection"));
  var rLab = el("label", "What would you change next time. (optional)", { for: "refl" });
  app.appendChild(rLab);
  var ri = document.createElement("input");
  ri.type = "text"; ri.id = "refl"; ri.maxLength = 200;
  ri.value = c.verdict.reflection || "";
  ri.addEventListener("blur", function () { c.verdict.reflection = ri.value; saveState(); });
  app.appendChild(ri);
  var row = el("div", null, { className: "btn-row" });
  row.appendChild(link("#/now", "Start the next campaign", "btn"));
  row.appendChild(link("#/history", "History", "btn btn-secondary"));
  app.appendChild(row);
  h.focus({ preventScroll: true });
}

/* history */
function viewHistory() {
  setNav("history");
  clearApp();
  var h = el("h1", "History");
  h.tabIndex = -1;
  app.appendChild(h);
  var settled = state.campaigns.filter(function (c) { return c.status === "settled"; });
  settled.sort(function (a, b) { return (b.verdict.settledAt || "") < (a.verdict.settledAt || "") ? -1 : 1; });
  if (!settled.length) {
    app.appendChild(el("p", "Settled campaigns will appear here.", { className: "muted" }));
    h.focus({ preventScroll: true });
    return;
  }
  var cal = calibrationSummary(settled);
  if (cal) {
    var cb = el("div", null, { className: "card" });
    cb.appendChild(el("p", cal.line));
    if (cal.advice) cb.appendChild(el("p", cal.advice, { className: "muted" }));
    app.appendChild(cb);
  }
  var ul = el("ul", null, { className: "plain" });
  settled.forEach(function (c) {
    var li = document.createElement("li");
    var a = link("#/c/" + c.id, "", null);
    a.className = "row-link";
    var title = el("span", c.objective, { className: "row-title" });
    a.appendChild(title);
    var label = c.verdict.outcome === "pass" ? "Pass" : c.verdict.outcome === "abandoned" ? "Abandoned" : "Fail";
    a.appendChild(el("span", label, { className: "tag" }));
    if (c.verdict.payoutDone) a.appendChild(el("span", "paid out", { className: "tag" }));
    li.appendChild(a);
    var sub = el("p", fmtDate(c.startDate) + " to " + fmtDate(c.verdictDate) + ". " + fmtRs(c.stake) + ".", { className: "muted" });
    li.appendChild(sub);
    ul.appendChild(li);
  });
  app.appendChild(ul);
  h.focus({ preventScroll: true });
}
function viewBackup() {
  setNav("backup");
  clearApp();
  var h = el("h1", "Backup");
  h.tabIndex = -1;
  app.appendChild(h);
  app.appendChild(el("p", "Backup with export and import arrives in Phase 2. Your data stays in this browser until then.", { className: "muted" }));
  app.appendChild(link("#/now", "Back to Now", "btn btn-secondary"));
  h.focus({ preventScroll: true });
}

/* 7. router */
function route() {
  var hash = location.hash || "#/now";
  if (hash.indexOf("#/new") === 0) { viewNew(); return; }
  if (hash.indexOf("#/verdict") === 0) { viewVerdict(); return; }
  if (hash.indexOf("#/history") === 0) { viewHistory(); return; }
  if (hash.indexOf("#/backup") === 0) { viewBackup(); return; }
  if (hash.indexOf("#/c/") === 0) { viewResult(hash.slice(4)); return; }
  if (hash !== "#/now") { location.hash = "#/now"; return; }
  viewNow();
}

/* 8. init */
document.getElementById("brand").textContent = APP_NAME;
document.title = APP_NAME;
loadState();
window.addEventListener("hashchange", route);
window.addEventListener("storage", function (ev) {
  if (ev.key === STORE_KEY) { loadState(); route(); }
});
route();

})();
</script>
</body>
</html>
